# Build + verify + publish the Chronos-2 checkpoints. Triggered only by a deliberate
# bump of its lock file (so a code change does not re-burn the export) or a manual
# dispatch. Inlined for one model; extract a reusable workflow if a second model lands.
name: export-chronos2

on:
  push:
    branches: [main]
    paths:
      - src/fmckpt/models/chronos2/checkpoint.lock
  workflow_dispatch:
    inputs:
      private:
        description: Publish to a private HuggingFace repo.
        default: true
        type: boolean

jobs:
  export:
    # The ~478 MB Chronos-2 export fits ubuntu-latest; bump to a larger runner
    # (org-configured) if a bigger model needs more disk/RAM.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [chronos-2, chronos-2-small]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra chronos
      - name: Export + verify
        run: uv run fmckpt export "${{ matrix.model }}" --out artifacts
      - name: Publish
        # push (no inputs) defaults to private; dispatch honours the toggle.
        run: uv run fmckpt publish "${{ matrix.model }}" --out artifacts ${{ (inputs.private == null || inputs.private) && '--private' || '--public' }}
