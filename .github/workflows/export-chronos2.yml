# Build + verify + publish the Chronos-2 checkpoints. Manual dispatch only, so an
# export is always a deliberate act (the heavy ~478 MB build never auto-runs on a
# code change). Inlined for one model; extract a reusable workflow if a second lands.
name: export-chronos2

on:
  workflow_dispatch:
    inputs:
      private:
        description: Publish to a private HuggingFace repo.
        default: true
        type: boolean

jobs:
  export:
    # The ~478 MB Chronos-2 export fits ubuntu-latest; bump to a larger runner
    # (org-configured) if a bigger model needs more disk/RAM.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [chronos-2, chronos-2-small]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra chronos
      - name: Export + verify
        run: uv run openstef-checkpoints export "${{ matrix.model }}"
      - name: Publish
        # dispatch honours the private toggle (defaults to private).
        run: uv run openstef-checkpoints publish "${{ matrix.model }}" ${{ inputs.private && '--private' || '--public' }}
