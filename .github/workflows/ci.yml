name: ci

# Runs on every push (any branch) and PR. Cheap to over-run for a low-traffic producer
# repo, and it lets a branch push validate CI without touching main (where the export
# workflow lives).
on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (poe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra chronos

      # Mirror `poe all --check` as discrete steps for granular logs; always() runs
      # them all, then the final gate fails the job if any failed.
      - name: reuse
        if: ${{ always() }}
        run: uv run poe reuse
      - name: licensecheck
        if: ${{ always() }}
        run: uv run poe licensecheck --check
      - name: lint
        if: ${{ always() }}
        run: uv run poe lint --check
      - name: format
        if: ${{ always() }}
        run: uv run poe format --check
      - name: lock
        if: ${{ always() }}
        run: uv run poe lock --check
      - name: type
        if: ${{ always() }}
        run: uv run poe type
      - name: tests
        if: ${{ always() }}
        run: uv run poe tests

      - name: Fail if any quality step failed
        if: ${{ failure() }}
        run: exit 1
