name: ci

# Runs on every push (any branch) and PR. Cheap to over-run for a low-traffic producer
# repo, and it lets a branch push validate CI without touching main (where the export
# workflow lives).
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The [chronos] extra (torch + chronos-forecasting) is needed so `ty` can
      # type-check the torch export modules. It is heavy; cache keeps it bearable.
      - run: uv sync --extra chronos
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q
