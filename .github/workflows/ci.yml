name: ci

# Runs on every push (any branch), which covers both a branch push that backs a PR and a
# merge to main, without touching the export workflow. Push-only (no `pull_request`) so a
# PR branch in this repo is validated exactly once, not twice.
on: push

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (poe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra chronos

      # Mirror `poe all --check` as discrete steps for granular logs; always() runs
      # them all, then the final gate fails the job if any failed.
      - name: reuse
        if: ${{ always() }}
        run: uv run poe reuse
      - name: licensecheck
        if: ${{ always() }}
        run: uv run poe licensecheck --check
      - name: lint
        if: ${{ always() }}
        run: uv run poe lint --check
      - name: format
        if: ${{ always() }}
        run: uv run poe format --check
      - name: lock
        if: ${{ always() }}
        run: uv run poe lock --check
      - name: type
        if: ${{ always() }}
        run: uv run poe type
      - name: tests
        if: ${{ always() }}
        run: uv run poe tests

      - name: Fail if any quality step failed
        if: ${{ failure() }}
        run: exit 1
