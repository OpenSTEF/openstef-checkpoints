[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "openstef-checkpoints"
version = "0.0.0"
description = "Export, verify, and publish OpenSTEF foundation-model ONNX checkpoints"
readme = "README.md"
keywords = [ "chronos", "forecasting", "foundationmodels", "onnx" ]
license = "MPL-2.0"
requires-python = ">=3.12,<4.0"

# Base install covers schema, ONNX-graph verification, publishing, and the CLI.
# Producing a checkpoint additionally needs the source-model stack, behind [chronos].
dependencies = [
  "huggingface-hub>=1.19", # >=1.19 for OIDC trusted publishing
  "jinja2>=3.1",
  "numpy>=2",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "rich>=13",
  "typer>=0.12",
]
optional-dependencies.chronos = [
  "chronos-forecasting>=2.2.2", # the Chronos-2 line
  "torch>=2.4",
]
scripts.openstef-checkpoints = "openstef_checkpoints.cli:app"

[tool.uv]
# chronos pins transformers<5, but transformers 4.x caps huggingface-hub<1.0 and so
# blocks OIDC publishing. transformers 5 lifts the cap; the export deviation gate
# confirms chronos 2.2.2 stays numerically correct on it, so override the pin.
override-dependencies = [ "transformers>=5" ]

[dependency-groups]
dev = [
  "licensecheck>=2025.1",
  "poethepoet>=0.29",
  "pytest>=8",
  "reuse>=5.0.2",
  "ruff>=0.12.8",
  "ty>=0.0.1a10",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/openstef_checkpoints" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = [ "--import-mode=importlib", "--strict-markers" ]

[tool.ty.src]
include = [ "src/**/*.py", "tests/**/*.py" ]
exclude = [ "**/.venv/**" ]

[tool.ty.rules]
all = "error"
possibly-missing-attribute = "ignore" # large number of false positives, captured by ruff
possibly-missing-import = "ignore"    # large number of false positives, captured by ruff(I002)

[tool.licensecheck]
# MPL-2.0 §3.3 permits distributing the work in a Larger Work under Apache-2.0, so an
# Apache-licensed dependency is compatible. licensecheck does not encode that pairing and
# reports it as a failure, so the two spellings it emits for Apache are ignored here.
ignore_licenses = [ "apache software license", "apache license 2.0" ]
# NVIDIA CUDA runtime libraries (the nvidia-* and cuda-* wheels below) are proprietary but
# redistributable, and only reach us as Linux GPU transitives of torch. They are not part
# of what we distribute. A new CUDA major adds new -cuNN-suffixed names, which then fail
# the check until reviewed and added here.
ignore_packages = [
  "cuda-bindings",
  "cuda-toolkit",
  "nvidia-cublas",
  "nvidia-cuda-cupti",
  "nvidia-cuda-nvrtc",
  "nvidia-cuda-runtime",
  "nvidia-cudnn-cu13",
  "nvidia-cufft",
  "nvidia-cufile",
  "nvidia-curand",
  "nvidia-cusolver",
  "nvidia-cusparse",
  "nvidia-cusparselt-cu13",
  "nvidia-nccl-cu13",
  "nvidia-nvjitlink",
  "nvidia-nvshmem-cu13",
  "nvidia-nvtx",
]

[tool.poe]
# Task definitions live in poe_tasks.toml (split out to keep this file lean).
include = [ "poe_tasks.toml" ]
