[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "fmckpt"
version = "0.0.0"
description = "Export, verify, and publish OpenSTEF foundation-model ONNX checkpoints"
readme = "README.md"
keywords = [ "chronos", "forecasting", "foundationmodels", "onnx" ]
license = "MPL-2.0"
requires-python = ">=3.12,<4.0"

# Base install covers schema, verification of an existing ONNX graph, publishing,
# and the CLI. Producing a checkpoint additionally needs the heavy source-model
# stack, kept behind the [chronos] extra so lint/type/test stay light by default.
dependencies = [
  # Low floor on purpose: chronos-forecasting's transformers stack caps huggingface-hub
  # below 1.0, and the publish API (HfApi.upload_folder/create_repo) is available far below
  # that. Pinning >=1.x makes the [chronos] extra unresolvable.
  "huggingface-hub>=0.24",
  "jinja2>=3.1",
  "numpy>=2",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "pydantic>=2.9",
  "rich>=13",
  "typer>=0.12",
]
optional-dependencies.chronos = [
  "chronos-forecasting>=2.2.0rc4", # the Chronos-2 line (pre-release; supports numpy>=2)
  "torch>=2.4",
]
scripts.fmckpt = "fmckpt.cli:app"

[tool.uv]
# "explicit" allows pre-releases ONLY for packages whose specifier requests one
# (here chronos-forecasting>=2.2.0rc4, the Chronos-2 line). Everything else stays on
# stable releases — a blanket "allow" would also pull pre-release numpy/pydantic/etc.
prerelease = "explicit"

[dependency-groups]
dev = [
  "licensecheck>=2025.1",
  "poethepoet>=0.29",
  "pytest>=8",
  "reuse>=5.0.2",
  "ruff>=0.12.8",
  "ty>=0.0.1a10",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/fmckpt" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = [ "--import-mode=importlib", "--strict-markers" ]

[tool.ty.src]
include = [ "src/**/*.py", "tests/**/*.py" ]
exclude = [ "**/.venv/**" ]

[tool.ty.rules]
all = "error"
possibly-missing-attribute = "ignore" # large number of false positives, captured by ruff
possibly-missing-import = "ignore"    # large number of false positives, captured by ruff(I002)

[tool.licensecheck]
# MPL-2.0 is compatible with Apache/BSD/MIT; licensecheck flags Apache as a false
# positive (it is explicitly listed compatible by the MPL), so ignore it.
ignore_licenses = [ "apache software license", "apache license 2.0" ]

[tool.poe.tasks.lint]
help = "Lint with ruff (ALL rules); --check to not fix"
args = [ { name = "check", type = "boolean", help = "Only report, do not fix" } ]
control.expr = "check"
switch = [ { case = "True", cmd = "ruff check" }, { cmd = "ruff check --fix" } ]

[tool.poe.tasks.format]
help = "Format with ruff; --check to verify only"
args = [ { name = "check", type = "boolean", help = "Only check formatting" } ]
control.expr = "check"
switch = [ { case = "True", cmd = "ruff format --check" }, { cmd = "ruff format" } ]

[tool.poe.tasks.type]
help = "Type-check with ty"
cmd = "ty check"

[tool.poe.tasks.tests]
help = "Run the test suite"
cmd = "pytest"

[tool.poe.tasks.lock]
help = "Refresh the lockfile; --check to verify it is current"
cmd = "uv lock ${check:+--check}"
args = [ { name = "check", type = "boolean", help = "Only verify the lockfile is up to date" } ]

[tool.poe.tasks.reuse]
help = "Check REUSE compliance (with optional --fix)"
args = [ { name = "fix", type = "boolean", help = "Annotate missing SPDX headers before linting" } ]
control.expr = "fix"
switch = [
  { case = "True", cmd = "uv run tools/reuse-fix.py --license \"MPL-2.0\" --copyright \"Contributors to the OpenSTEF project <openstef@lfenergy.org>\"" },
  { cmd = "reuse lint" },
]

[tool.poe.tasks.licensecheck]
help = "Audit distributed dependency licenses (runtime + [chronos]) for MPL-2.0 compatibility"
# Feed licensecheck the lock export scoped to what we ship (runtime + the chronos extra,
# excluding the dev group): deterministic, and avoids depgather needing a resolver on PATH.
args = [ { name = "check", type = "boolean", help = "Exit non-zero on an incompatible license" } ]
control.expr = "check"
switch = [
  { case = "True", shell = "uv export --frozen --no-dev --extra chronos --no-emit-project --no-hashes -o /tmp/fmckpt-licensecheck.txt && licensecheck -r /tmp/fmckpt-licensecheck.txt --zero --show-only-failing" },
  { shell = "uv export --frozen --no-dev --extra chronos --no-emit-project --no-hashes -o /tmp/fmckpt-licensecheck.txt && licensecheck -r /tmp/fmckpt-licensecheck.txt" },
]

[tool.poe.tasks.all]
help = "Run the full CI sequence; --check to verify without writing"
control.expr = "check"
args = [ { name = "check", type = "boolean", help = "Only check, do not fix/write" } ]
# Lint (sorts imports) must precede format (cannot sort imports).
switch = [
  { case = "True", sequence = [
    "reuse",
    "licensecheck --check",
    "lint --check",
    "format --check",
    "lock --check",
    "type",
    "tests",
  ], ignore_fail = "return_non_zero" },
  { sequence = [
    "licensecheck --check",
    "reuse --fix",
    "lint",
    "format",
    "lock",
    "type",
    "tests",
  ], ignore_fail = "return_non_zero" },
]
