[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "openstef-checkpoints"
version = "0.0.0"
description = "Export, verify, and publish OpenSTEF foundation-model ONNX checkpoints"
readme = "README.md"
keywords = [ "chronos", "forecasting", "foundationmodels", "onnx" ]
license = "MPL-2.0"
requires-python = ">=3.12,<4.0"

# Base install covers schema, ONNX-graph verification, publishing, and the CLI.
# Producing a checkpoint additionally needs the source-model stack, behind [chronos].
dependencies = [
  "huggingface-hub>=1.19", # >=1.19 for OIDC trusted publishing
  "jinja2>=3.1",
  "numpy>=2",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "rich>=13",
  "typer>=0.12",
]
# The Chronos-2 source-model stack. Require >=2.3.0: chronos-forecasting<2.3 pins transformers<5,
# and transformers 5 silently mis-loads Chronos-2 under those older versions (its non-persistent
# RoPE/quantile buffers are left zeroed -> a degenerate, near-constant forecaster). The torch-vs-ONNX
# export gate cannot catch that, since both sides share the same broken weights. 2.3.0 (2026-06-18)
# rewrote RoPE onto the transformers-5 standard rotary API, so the buffers initialise correctly and
# the model loads cleanly on huggingface-hub>=1.0 — no transformers override needed.
optional-dependencies.chronos = [
  "chronos-forecasting>=2.3.0", # the Chronos-2 line; >=2.3.0 loads correctly on transformers 5
  "torch>=2.4",
]
scripts.openstef-checkpoints = "openstef_checkpoints.cli:app"

[tool.uv]
# Export runs on CPU (the runners have no GPU), so resolve torch from PyTorch's CPU-only
# index. This drops the multi-GB CUDA stack (the nvidia-* / cuda-* wheels) the default PyPI
# build pulls in as Linux transitives and that nothing here ever uses. Numerically identical
# on CPU, since the CUDA build only adds device kernels the export never touches.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "licensecheck>=2025.1",
  "poethepoet>=0.29",
  "pytest>=8",
  "reuse>=5.0.2",
  "ruff>=0.12.8",
  "ty>=0.0.1a10",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/openstef_checkpoints" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = [ "--import-mode=importlib", "--strict-markers" ]

[tool.ty.src]
include = [ "src/**/*.py", "tests/**/*.py" ]
exclude = [ "**/.venv/**" ]

[tool.ty.rules]
all = "error"
possibly-missing-attribute = "ignore" # large number of false positives, captured by ruff
possibly-missing-import = "ignore"    # large number of false positives, captured by ruff(I002)

[tool.licensecheck]
# MPL-2.0 §3.3 permits distributing the work in a Larger Work under Apache-2.0, so an
# Apache-licensed dependency is compatible. licensecheck does not encode that pairing and
# reports it as a failure, so the two spellings it emits for Apache are ignored here.
ignore_licenses = [ "apache software license", "apache license 2.0" ]
# We install the CPU-only torch build, which pulls no nvidia-* / cuda-* wheels (they are gone
# from the lock and the venv). But licensecheck audits against PyPI metadata, where `torch` is
# the CUDA build that still declares those proprietary-but-redistributable CUDA libraries as
# dependencies, so they resurface here even though we never ship them. The globs ignore the
# whole family at once, so a CUDA version bump (new -cuNN names) does not break the check.
ignore_packages = [ "nvidia*", "cuda*" ]

[tool.poe]
# Task definitions live in poe_tasks.toml (split out to keep this file lean).
include = [ "poe_tasks.toml" ]
